# hitman-server on the console in proxy mode (docs/ARCHITECTURE_PS5_PEACOCK.md): the game stays on
# http://127.0.0.1:8000 and every request goes to the full Peacock server on the Mac
# (scripts/backend.sh start). Deploy with: make -C server deploy CONFIG=config.ps5-proxy.ini
upstream = http://192.168.0.62:8410
upstream_timeout = 30
# Only /healthz is served to the LAN; game routes are for the console itself.
lan_access = health
# debug logs request/response previews (never tokens or the OAuth form values) for the first runs.
log_level = debug
